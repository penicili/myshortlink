name: ci

on:
  push:
    paths:
      - app/**
    branches:
      - master

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      commit_id: ${{ steps.commit.outputs.short }}
    steps:
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - 
        id: commit
        uses: prompt/actions-commit-hash@v4
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/myshortlink:${{ steps.commit.outputs.short }}
  cd:
    needs: ci
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      -
        name: Change values file
        shell: bash
        env:
          VERSION: v4.44.3
          PLATFORM: linux_amd64
        run: |
          echo ${{needs.ci.outputs.commit_id}}
          curl -L "https://github.com/mikefarah/yq/releases/download/${VERSION}/yq_${PLATFORM}" -o /usr/local/bin/yq && \
          chmod +x /usr/local/bin/yq
          yq -i '.images.tag = "${{needs.ci.outputs.commit_id}}"' helm/shortlink-app/values.yaml
      -
        name: Commit Changes
        uses: EndBug/add-and-commit@v10
        with:
          message: 'Update valuies.yaml with commit ${{needs.ci.outputs.commit_id}}'
      -
        name: Install argocd cli
        run: |
          curl -ksSL -o argocd https://argocd-server.argocd/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv ./argocd /usr/local/bin/argocd
      -
        name: ArgoCD login and sync
        run: |
          argocd login argocd-server.argocd \
            --insecure --grpc-web --username admin \
            --password ${{ secrets.ARGOCD_CLI_PASSWORD }}
          argocd app sync shortlink-app