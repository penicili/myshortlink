name: ci

on:
  push:
    paths:
      - app/**
    branches:
      - master

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - 
        id: commit
        uses: prompt/actions-commit-hash@v4
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/myshortlink:${{ steps.commit.outputs.short }}
  cd:
    needs: ci
    runs-on: self-hosted
    steps:
      -
        name: ArgoCD login and sync
        run: 
          argocd login argocd-server.argocd \
            --insecure --grpc-web --username admin \
            --password ${{ secrets.ARGOCD_CLI_PASSWORD }}
          argocd app sync shortlink-app